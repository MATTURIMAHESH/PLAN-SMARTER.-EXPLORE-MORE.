              <Icon name="flag" size={20} className="text-emerald-300" />
            </div>
          </div>
          <div className="flex-1 flex items-center">
            <div className="text-[12.5px] text-emerald-300 font-semibold">
              Trip ends · {fromMinutes(route.legs[route.legs.length - 1].depart)}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function ResultsPage({ result, activeAlgo, setActiveAlgo, attractions, trip, route, go }) {
  if (!result) {
    return <EmptyState icon="chart" title="No plan generated yet"
      message="Enter your attractions, budget and available time, then run the planner to see the optimised itinerary here."
      action={<button onClick={() => go('plan')} className="btn btn-primary"><Icon name="route" size={15} /> Plan a Trip</button>} />;
  }

  const active = activeAlgo === 'greedy' ? result.greedy : result.knapsack;
  const totalVisitTime = active.selected.reduce((s, a) => s + a.duration, 0);
  const totalCost = active.selected.reduce((s, a) => s + a.cost, 0);
  const totalValue = active.selected.reduce((s, a) => s + a.value, 0);
  const grandTotalTime = totalVisitTime + route.totalTravel;
  const overTime = grandTotalTime > trip.time + 1e-6;

  return (
    <div className="space-y-6 fade-in">
      {/* header */}
      <Card hover={false} className="relative overflow-hidden p-5 sm:p-7 celebrate">
        <div className="absolute -top-20 -right-16 w-64 h-64 rounded-full bg-cyan-500/12 blur-3xl" />
        <div className="absolute -bottom-24 -left-12 w-64 h-64 rounded-full bg-violet-600/12 blur-3xl" />
        <div className="relative flex flex-wrap items-start justify-between gap-4">
          <div>
            <Chip tone="emerald"><Icon name="check" size={11} /> PLAN GENERATED SUCCESSFULLY</Chip>
            <h1 className="font-display font-black text-2xl sm:text-4xl tracking-tight mt-3">
              <span className="grad-text">YOUR OPTIMIZED TRIP</span>
            </h1>
            <p className="text-[13px] text-slate-400 mt-2">
              {trip.name} · {active.selected.length} attractions · {PREFERENCES.find((p) => p.key === trip.preference)?.label}
            </p>
          </div>
          <div className="flex gap-1 p-1 rounded-xl glass-soft">
            {[['knapsack', 'Knapsack'], ['greedy', 'Greedy']].map(([k, l]) => (
              <button key={k} onClick={() => setActiveAlgo(k)} className={`tab ${activeAlgo === k ? 'tab-active' : ''}`}>{l}</button>
            ))}
          </div>
        </div>
      </Card>

      {/* metrics */}
      <div className="grid grid-cols-2 lg:grid-cols-5 gap-3 sm:gap-4">
        <StatCard icon="wallet" label="Total Cost" value={totalCost} prefix="₹" accent="cyan" />
        <StatCard icon="clock" label="Total Time (incl. travel)" value={grandTotalTime} decimals={1} suffix="h" accent="violet" />
        <StatCard icon="star" label="Total Value" value={totalValue} accent="emerald" />
        <StatCard icon="pin" label="Attractions Selected" value={active.selected.length} accent="amber" />
        <StatCard icon="route" label="Travel Distance" value={route.totalDist} decimals={1} suffix=" km" accent="rose" />
      </div>

      {overTime && (
        <div className="glass rounded-2xl p-4 border-amber-400/30 flex items-start gap-3">
          <Icon name="info" size={18} className="text-amber-300 shrink-0 mt-0.5" />
          <p className="text-[12.5px] text-amber-200/90 leading-relaxed">
            The visit durations fit your time budget, but adding travel time pushes the total to <b>{HRS(grandTotalTime)}</b> against a budget of {HRS(trip.time)}.
            Consider increasing available time or removing one stop.
          </p>
        </div>
      )}

      {/* usage rings */}
      <div className="grid lg:grid-cols-3 gap-4">
        <Card hover={false} className="p-5 flex items-center justify-around gap-4 flex-wrap">
          <ProgressRing value={totalCost} max={trip.budget} color="#22d3ee" label="Budget Used"
            center={`${Math.round((totalCost / trip.budget) * 100) || 0}%`} sub={`${INR(totalCost)} / ${INR(trip.budget)}`} />
          <ProgressRing value={totalVisitTime} max={trip.time} color="#8b5cf6" label="Time Used (visits)"
            center={`${Math.round((totalVisitTime / trip.time) * 100) || 0}%`} sub={`${HRS(totalVisitTime)} / ${HRS(trip.time)}`} />
        </Card>

        <Card hover={false} className="p-5 lg:col-span-2">
          <div className="font-display font-bold text-[15px] mb-4">Resource Utilisation</div>
          <div className="space-y-4">
            <Bar label="Budget utilisation" value={totalCost} max={trip.budget} color="cyan"
              right={`${INR(totalCost)} / ${INR(trip.budget)}`} />
            <Bar label="Visit time utilisation" value={totalVisitTime} max={trip.time} color="violet"
              right={`${HRS(totalVisitTime)} / ${HRS(trip.time)}`} delay={80} />
            <Bar label="Travel time (additional)" value={route.totalTravel} max={trip.time} color="amber"
              right={`${HRS(route.totalTravel)}`} delay={160} />
            <Bar label="Total value achieved" value={totalValue} max={Math.max(1, active.selected.length * 100)} color="emerald"
              right={`${totalValue} / ${active.selected.length * 100}`} delay={240} />
          </div>
        </Card>
      </div>

      {/* timeline + selection */}
      <div className="grid lg:grid-cols-[1.3fr_1fr] gap-4">
        <Card hover={false} className="p-5">
          <SectionTitle icon="route" title="Recommended Visit Order"
            subtitle={`Nearest-neighbour + 2-opt · departs ${trip.startClock}`} />
          <RouteTimeline route={route} />
        </Card>

        <div className="space-y-4">
          <Card hover={false} className="p-5">
            <div className="font-display font-bold text-[15px] mb-3">Selected Attractions</div>
            <div className="space-y-2">
              {active.selected.map((a) => (
                <div key={a.id} className="flex items-center gap-3 rounded-xl bg-white/[.03] border border-slate-700/40 px-3 py-2.5">
                  <div className="w-7 h-7 rounded-lg bg-emerald-500/15 border border-emerald-400/25 grid place-items-center text-emerald-300 shrink-0">
                    <Icon name="check" size={13} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="text-[12.5px] font-semibold text-slate-200 truncate">{a.name}</div>
                    <div className="text-[10.5px] text-slate-500 mono">{HRS(a.duration)} · {INR(a.cost)} · value {a.value}</div>
                  </div>
                </div>
              ))}
              {active.selected.length === 0 && (
                <p className="text-[12.5px] text-slate-500">No attractions could be selected under these constraints.</p>
              )}
            </div>
          </Card>

          <Card hover={false} className="p-5">
            <div className="font-display font-bold text-[15px] mb-3">Unused Resources</div>
            <div className="grid grid-cols-2 gap-3">
              <div className="rounded-xl bg-white/[.03] border border-slate-700/40 p-3">
                <div className="text-[10.5px] uppercase tracking-wide text-slate-500">Unused Time</div>
                <div className="mono text-[17px] font-bold text-cyan-300 mt-1">{HRS(Math.max(0, trip.time - totalVisitTime))}</div>
              </div>
              <div className="rounded-xl bg-white/[.03] border border-slate-700/40 p-3">
                <div className="text-[10.5px] uppercase tracking-wide text-slate-500">Unused Budget</div>
                <div className="mono text-[17px] font-bold text-violet-300 mt-1">{INR(Math.max(0, trip.budget - totalCost))}</div>
              </div>
            </div>
            <button onClick={() => go('map')} className="btn btn-primary w-full mt-4">
              <Icon name="map" size={15} /> View Route on Map
            </button>
          </Card>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------------
   12. COMPARISON
   ------------------------------------------------------------------------- */
function SimpleBarChart({ title, data, unit = '', color = 'cyan', formatter = (v) => v }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  const colors = { cyan: '#22d3ee', violet: '#a78bfa', emerald: '#34d399', amber: '#fbbf24' };
  return (
    <Card hover={false} className="p-4">
      <div className="font-display font-bold text-[13.5px] mb-4">{title}</div>
      <div className="flex items-end gap-4 h-[170px]">
        {data.map((d, i) => (
          <div key={d.label} className="flex-1 flex flex-col items-center justify-end h-full">
            <div className="text-[12px] mono font-bold text-slate-200 mb-1.5">{formatter(d.value)}{unit}</div>
            <div className="w-full rounded-t-lg relative overflow-hidden" style={{ height: `${(d.value / max) * 100}%`, minHeight: 6, background: `linear-gradient(180deg, ${colors[color]}, ${colors[color]}33)`, transition: 'height .9s cubic-bezier(.2,.8,.2,1)', transitionDelay: `${i * 90}ms` }}>
              <div className="absolute inset-0" style={{ boxShadow: `inset 0 0 22px ${colors[color]}55` }} />
            </div>
            <div className="text-[10.5px] text-slate-400 mt-2 text-center leading-tight">{d.label}</div>
          </div>
        ))}
      </div>
    </Card>
  );
}

function ComparisonPage({ result, trip, go }) {
  if (!result) {
    return <EmptyState icon="branch" title="Nothing to compare yet"
      message="Run the planner first — the comparison uses the real results produced by Greedy and Knapsack on your data."
      action={<button onClick={() => go('plan')} className="btn btn-primary"><Icon name="route" size={15} /> Plan a Trip</button>} />;
  }

  const g = result.greedy, k = result.knapsack;

  const rows = [
    ['Algorithm', 'Greedy Selection', '0/1 Knapsack (2D DP)', 'Graph Route Planning'],
    ['Purpose', 'Fast local optimisation', 'Global optimisation under constraints', 'Feasible visit order & shortest route'],
    ['Time Complexity', g.complexity.time, k.complexity.time, 'O(V²) Dijkstra · O(V²) 2-opt per pass'],
    ['Space Complexity', g.complexity.space, k.complexity.space, 'O(V + E)'],
    ['Attractions Selected', g.selected.length, k.selected.length, '—'],
    ['Total Value', g.totalValue, k.totalValue, '—'],
    ['Total Cost', INR(g.totalCost), INR(k.totalCost), '—'],
    ['Visit Time', HRS(g.totalTime), HRS(k.totalTime), '—'],
    ['Advantages', 'Very fast; simple to implement; scales to large inputs.', 'Guarantees the optimal value for the given constraints.', 'Produces an executable itinerary with travel legs.'],
    ['Limitations', 'Local choice may block a better global combination.', 'Memory grows with T × B discretisation; pseudo-polynomial.', 'Heuristic ordering — not guaranteed optimal TSP tour.'],
  ];

  return (
    <div className="space-y-6 fade-in">
      <Card hover={false} className="p-5 sm:p-6">
        <SectionTitle icon="branch" title="Algorithm Comparison"
          subtitle="Greedy vs 0/1 Knapsack vs Graph-based route planning — measured on your current inputs." />
        <div className="overflow-x-auto rounded-xl border border-slate-700/40">
          <table className="w-full text-[12px] min-w-[760px]">
            <thead>
              <tr className="bg-white/[.03] text-left">
                {rows[0].map((h, i) => (
                  <th key={h} className={`px-4 py-3 font-semibold ${i === 0 ? 'text-slate-400 text-[10.5px] uppercase tracking-wider' : 'text-cyan-200 font-display text-[12.5px]'}`}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.slice(1).map((r, ri) => (
                <tr key={ri} className="border-t border-slate-700/30 hover:bg-white/[.02]">
                  <td className="px-4 py-3 text-slate-400 font-semibold whitespace-nowrap">{r[0]}</td>
                  <td className="px-4 py-3 text-slate-300">{r[1]}</td>
                  <td className="px-4 py-3 text-slate-300">{r[2]}</td>
                  <td className="px-4 py-3 text-slate-300">{r[3]}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Card>

      <div className="grid sm:grid-cols-2 xl:grid-cols-4 gap-4">
        <SimpleBarChart title="Total Value Comparison" color="emerald"
          data={[{ label: 'Greedy', value: g.totalValue }, { label: 'Knapsack', value: k.totalValue }]} />
        <SimpleBarChart title="Total Cost Comparison" color="cyan" formatter={(v) => '₹' + v}
          data={[{ label: 'Greedy', value: g.totalCost }, { label: 'Knapsack', value: k.totalCost }]} />
        <SimpleBarChart title="Visit Time Used" color="violet" unit="h"
          data={[{ label: 'Greedy', value: round1(g.totalTime) }, { label: 'Knapsack', value: round1(k.totalTime) }]} />
        <SimpleBarChart title="Attractions Selected" color="amber"
          data={[{ label: 'Greedy', value: g.selected.length }, { label: 'Knapsack', value: k.selected.length }]} />
      </div>

      <Card hover={false} className="p-5">
        <SectionTitle icon="info" title="Interpretation" />
        <div className="space-y-3 text-[13px] text-slate-300 leading-relaxed">
          <p>
            <b className="text-cyan-300">Greedy</b> sorts candidates by a single efficiency score and takes the best
            feasible option at every step. It runs in <span className="mono text-amber-300">O(n log n)</span> and is
            extremely fast, but a locally optimal choice can block a better global combination — it does <i>not</i> guarantee
            the optimal selection.
          </p>
          <p>
            <b className="text-violet-300">0/1 Knapsack</b> explores every combination implicitly through a two-dimensional
            dynamic-programming table over <span className="mono text-amber-300">time × budget</span>. It
            <b> guarantees the maximum achievable objective</b> for the discretised problem, at the cost of
            <span className="mono text-amber-300"> O(n · T · B)</span> time and <span className="mono text-amber-300">O(T · B)</span> space.
          </p>
          <p>
            <b className="text-emerald-300">Graph planning</b> answers a different question: given a chosen set of attractions,
            <i> in what order should they be visited, and how long is the travel?</i> Dijkstra gives shortest travel times from
            the start, while nearest-neighbour + 2-opt produces a good (not provably optimal) open tour.
          </p>
          <p className="text-slate-400">
            Note: no single algorithm is universally "best". The right choice depends on whether you need speed
            (Greedy), a guaranteed optimum under constraints (Knapsack), or an executable route (Graph).
          </p>
        </div>
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------------------
   13. ABOUT / DOCUMENTATION
   ------------------------------------------------------------------------- */
function AboutPage() {
  const sections = [
    {
      icon: 'target', title: 'Problem Statement',
      body: 'Planning a city tour involves choosing which attractions to visit and in what order, under limited time and money. This is a constrained optimisation problem: select a subset of attractions that maximises the total experience value without exceeding the available time or budget, then determine a feasible travel order.'
    },
    {
      icon: 'flag', title: 'Objectives',
      body: '1) Model attractions with duration, cost, priority, value and geo-coordinates. 2) Implement a Greedy selector with a documented efficiency metric. 3) Implement a 0/1 Knapsack with TWO constraints (time + budget) using 2-D dynamic programming. 4) Model the city as a weighted graph and generate a visit order using nearest-neighbour + 2-opt, with Dijkstra/BFS/DFS for path analysis. 5) Visualise every algorithmic decision so the reasoning is auditable.'
    },
    {
      icon: 'cpu', title: 'Algorithms Used',
      body: 'Greedy — O(n log n): sort candidates by efficiency and take the best feasible one repeatedly. 0/1 Knapsack — O(n·T·B): 2-D dynamic programming over discretised time and budget. Dijkstra — O(V²): shortest travel time from the start node. BFS / DFS — O(V+E): traversal order demonstration. Nearest-Neighbour + 2-opt — O(V²) per improvement pass: practical route construction.'
    },
    {
      icon: 'db', title: 'Data Structures',
      body: 'Arrays / Lists — attraction records and decision logs. Objects / Maps — attraction lookup by id and adjacency lists for the graph. Graph (adjacency list) — nodes = attractions + start point, weighted edges = travel time. Priority selection — array scan emulating a priority queue in Dijkstra. DP Table — 2-D Float64Array over (time units × budget units) plus a 3-D choice tensor for solution reconstruction.'
    },
    {
      icon: 'activity', title: 'System Workflow',
      body: 'User Input → Attraction Processing & Validation → Greedy Selection → Knapsack Optimisation → Graph Construction → Route Generation (NN + 2-opt) → Result Visualisation (metrics, timeline, map, charts).'
    },
    {
      icon: 'trend', title: 'Complexity Summary',
      body: 'Greedy: time O(n log n), space O(n). Knapsack (2-D): time O(n·T·B), space O(T·B) for the DP table plus O(n·T·B) bits for reconstruction. Dijkstra (array PQ): time O(V²), space O(V). BFS/DFS: time O(V+E), space O(V). 2-opt: O(V²) per pass, at most a bounded number of passes.'
    },
    {
      icon: 'info', title: 'Limitations',
      body: 'Time and budget are discretised (0.5 h and ₹25 units), which can round edge cases. Travel time is estimated at a constant average speed of 25 km/h using great-circle distance — real road networks and traffic are not modelled. The route is heuristic, so it is not a provably optimal TSP tour. Greedy makes no optimality guarantee.'
    },
    {
      icon: 'sparkle', title: 'Future Enhancements',
      body: 'Integrate a real routing API (OSRM / Google Directions) for road-accurate travel times. Add opening-hours windows and turn it into a Time-Window Oriented TSP. Support multi-day itineraries with hotel anchoring. Add user accounts and persistent storage. Extend to a Genetic Algorithm or Ant Colony Optimisation for larger TSP instances.'
    },
  ];

  return (
    <div className="space-y-6 fade-in">
      <Card hover={false} className="p-6 sm:p-8 relative overflow-hidden">
        <div className="absolute -top-16 -right-10 w-56 h-56 rounded-full bg-violet-500/12 blur-3xl" />
        <div className="relative">
          <Chip tone="violet"><Icon name="info" size={11} /> PROJECT DOCUMENTATION</Chip>
          <h1 className="font-display font-black text-2xl sm:text-3xl mt-3 grad-text">About TRAVELMIND</h1>
          <p className="text-[13.5px] text-slate-400 mt-3 max-w-3xl leading-relaxed">
            TRAVELMIND is a Design and Analysis of Algorithms project that turns an everyday travel-planning problem
            into a study of algorithmic trade-offs. Every number shown in this application is computed live from the
            inputs you provide — nothing is pre-baked.
          </p>
        </div>
      </Card>

      <div className="grid md:grid-cols-2 gap-4">
        {sections.map((s, i) => (
          <Card key={s.title} className="p-5 fade-in" style={{ animationDelay: `${i * 60}ms` }}>
            <div className="flex items-center gap-3 mb-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500/18 to-violet-500/18 border border-cyan-400/25 grid place-items-center text-cyan-300">
                <Icon name={s.icon} size={17} />
              </div>
              <h3 className="font-display font-bold text-[15px] text-slate-100">{s.title}</h3>
            </div>
            <p className="text-[12.5px] text-slate-400 leading-relaxed">{s.body}</p>
          </Card>
        ))}
      </div>

      <Card hover={false} className="p-5">
        <SectionTitle icon="activity" title="Pipeline" subtitle="How a request flows through the system" />
        <div className="flex flex-wrap items-center gap-2">
          {['User Input', 'Attraction Processing', 'Greedy Selection', 'Knapsack Optimisation', 'Graph Route Generation', 'Result Visualisation'].map((s, i, arr) => (
            <React.Fragment key={s}>
              <span className="chip bg-cyan-500/10 text-cyan-200 border border-cyan-400/25 !text-[11.5px] !px-3 !py-1.5">{s}</span>
              {i < arr.length - 1 && <Icon name="arrowR" size={14} className="text-slate-600" />}
            </React.Fragment>
          ))}
        </div>
      </Card>
    </div>
  );
}

/* ---------------------------------------------------------------------------
   14. ROOT APP
   ------------------------------------------------------------------------- */
function App() {
  const [page, setPage] = useState('dashboard');
  const [collapsed, setCollapsed] = useState(false);
  const [mobileOpen, setMobileOpen] = useState(false);

  const [attractions, setAttractions] = useState(() => DEFAULT_ATTRACTIONS.map((a) => ({ ...a })));
  const [trip, setTrip] = useState({ ...DEFAULT_TRIP });
  const [result, setResult] = useState(null);
  const [activeAlgo, setActiveAlgo] = useState('knapsack');

  const [running, setRunning] = useState(false);
  const [progress, setProgress] = useState(0);
  const [runStep, setRunStep] = useState(0);

  const [toasts, setToasts] = useState([]);
  const notify = useCallback((msg, type = 'info') => {
    const id = uid();
    setToasts((t) => [...t, { id, msg, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 4600);
  }, []);
  const dismiss = (id) => setToasts((t) => t.filter((x) => x.id !== id));

  /* --------- particles --------- */
  useEffect(() => {
    for (let i = 0; i < 16; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.bottom = '-10px';
      p.style.animationDuration = (12 + Math.random() * 16) + 's';
      p.style.animationDelay = (Math.random() * 12) + 's';
      p.style.opacity = 0.15 + Math.random() * 0.35;
      document.body.appendChild(p);
    }
  }, []);

  /* --------- derived --------- */
  const startNode = useMemo(() => ({
    id: 'start',
    name: trip.startLocation || 'Start',
    lat: Number(trip.startLat) || 17.385,
    lng: Number(trip.startLng) || 78.4867,
    duration: 0, cost: 0, value: 0, priority: 0,
  }), [trip.startLocation, trip.startLat, trip.startLng]);

  const activeSelection = useMemo(() => {
    if (!result) return [];
    return activeAlgo === 'greedy' ? result.greedy.selected : result.knapsack.selected;
  }, [result, activeAlgo]);

  const route = useMemo(() => buildRoute(startNode, activeSelection, trip.startClock),
    [startNode, activeSelection, trip.startClock]);

  const selectedIds = useMemo(() => activeSelection.map((a) => a.id), [activeSelection]);

  /* --------- generate plan --------- */
  const generatePlan = () => {
    setRunning(true);
    setProgress(0);
    setRunStep(0);

    let s = 0;
    const iv = setInterval(() => {
      s += 1;
      setRunStep(Math.min(s, RUN_PHASES.length - 1));
      setProgress(Math.min(100, Math.round((s / RUN_PHASES.length) * 100)));
      if (s >= RUN_PHASES.length) clearInterval(iv);
    }, 280);

    setTimeout(() => {
      try {
        const opts = { budget: Number(trip.budget), time: Number(trip.time), preference: trip.preference };
        const greedy = runGreedy(attractions, opts);
        const knapsack = runKnapsack(attractions, opts);

        if (greedy.selected.length === 0 && knapsack.selected.length === 0) {
          notify('No feasible attractions found within the current time and budget constraints. Try increasing your budget or available time.', 'error');
          setRunning(false);
          clearInterval(iv);
          return;
        }
        setResult({ greedy, knapsack, at: Date.now() });
        setActiveAlgo(knapsack.selected.length >= greedy.selected.length ? 'knapsack' : 'knapsack');
        setRunning(false);
        setPage('results');
        notify('Optimal plan generated successfully.', 'success');
      } catch (e) {
        console.error(e);
        notify('Something went wrong while running the algorithms.', 'error');
        setRunning(false);
      }
      clearInterval(iv);
    }, RUN_PHASES.length * 280 + 260);
  };

  const loadDemo = () => {
    setAttractions(DEFAULT_ATTRACTIONS.map((a) => ({ ...a, id: uid() })));
    setTrip({ ...DEFAULT_TRIP });
    setResult(null);
    notify('Demo data loaded — 6 Hyderabad attractions, ₹1,000 budget, 8 hours.', 'success');
  };

  const resetProject = () => {
    setAttractions([]);
    setTrip({ ...DEFAULT_TRIP, name: 'New Trip', startLocation: 'Hyderabad City Center' });
    setResult(null);
    setPage('plan');
    notify('Project reset. Add attractions or load the demo data.', 'info');
  };

  const addToTrip = (a) => {
    if (attractions.some((x) => x.id === a.id)) { notify('This attraction is already in the trip.', 'info'); return; }
    setAttractions((l) => [...l, { ...a }]);
    notify(`${a.name} added to the trip.`, 'success');
  };

  const go = (p) => { setPage(p); setMobileOpen(false); };

  const main = () => {
    switch (page) {
      case 'dashboard':
        return <Dashboard attractions={attractions} trip={trip} result={result} go={go} />;
      case 'plan':
        return <PlanTrip trip={trip} setTrip={setTrip} attractions={attractions} setAttractions={setAttractions}
          onGenerate={generatePlan} running={running} progress={progress} runStep={runStep}
          notify={notify} onLoadDemo={loadDemo} onReset={resetProject} />;
      case 'attractions':
        return <AttractionsPage attractions={attractions} setAttractions={setAttractions} trip={trip} setTrip={setTrip}
          notify={notify} onAddToTrip={addToTrip} selectedIds={selectedIds} />;
      case 'algorithms':
        return <AlgorithmsPage attractions={attractions} trip={trip} result={result} notify={notify} go={go} />;
      case 'map':
        return <MapView attractions={attractions} trip={trip} route={route} selectedIds={selectedIds} startNode={startNode} />;
      case 'results':
        return <ResultsPage result={result} activeAlgo={activeAlgo} setActiveAlgo={setActiveAlgo}
          attractions={attractions} trip={trip} route={route} go={go} />;
      case 'comparison':
        return <ComparisonPage result={result} trip={trip} go={go} />;
      case 'about':
        return <AboutPage />;
      default:
        return null;
    }
  };

  return (
    <div className="min-h-screen">
      <Sidebar page={page} setPage={setPage} collapsed={collapsed} setCollapsed={setCollapsed}
        mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} />

      <div className={`transition-[padding] duration-300 ${collapsed ? 'lg:pl-[76px]' : 'lg:pl-[248px]'}`}>
        <TopBar page={page} onMenu={() => setMobileOpen(true)} trip={trip} hasPlan={!!result} />
        <main className="p-4 sm:p-6 max-w-[1500px] mx-auto pb-24 lg:pb-10">
          {main()}
        </main>
      </div>

      <Toasts items={toasts} dismiss={dismiss} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
