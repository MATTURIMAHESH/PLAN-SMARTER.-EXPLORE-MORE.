  .grid-bg{
    position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.35;
    background-image:linear-gradient(rgba(56,189,248,.055) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(56,189,248,.055) 1px, transparent 1px);
    background-size:52px 52px;
    mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
    -webkit-mask-image:radial-gradient(circle at 50% 30%, #000 0%, transparent 78%);
  }
  .blob{ position:fixed; border-radius:50%; filter:blur(90px); opacity:.30; z-index:0; pointer-events:none; }
  .blob-1{ width:520px;height:520px; background:#0ea5e9; top:-160px; left:-120px; animation:float1 18s ease-in-out infinite; }
  .blob-2{ width:460px;height:460px; background:#7c3aed; top:20%; right:-160px; animation:float2 22s ease-in-out infinite; }
  .blob-3{ width:400px;height:400px; background:#0891b2; bottom:-160px; left:35%; animation:float3 26s ease-in-out infinite; }
  @keyframes float1{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(60px,50px)} }
  @keyframes float2{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(-70px,60px)} }
  @keyframes float3{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(40px,-60px)} }
  .particle{ position:fixed; width:3px;height:3px;border-radius:50%; background:#67e8f9; opacity:.5; z-index:0; pointer-events:none; animation:rise linear infinite; box-shadow:0 0 8px #22d3ee; }
  @keyframes rise{ 0%{ transform:translateY(0) scale(.6); opacity:0 } 20%{opacity:.7} 100%{ transform:translateY(-100vh) scale(1); opacity:0 } }

    background:linear-gradient(160deg, rgba(19,26,45,.86) 0%, rgba(10,14,26,.78) 100%);
    border:1px solid rgba(56,189,248,.13);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }
  .glass-soft{
    background:linear-gradient(160deg, rgba(19,26,45,.62) 0%, rgba(10,14,26,.55) 100%);

  .card-hover:hover{ transform:translateY(-4px); border-color:rgba(34,211,238,.35); box-shadow:0 20px 55px -22px rgba(34,211,238,.55); }

  ::-webkit-scrollbar-thumb:hover{ background:linear-gradient(#22d3ee99,#8b5cf699); }

    width:100%; background:rgba(6,10,20,.75); border:1px solid rgba(148,163,184,.16);

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ============================================================================
   TRAVELMIND — Tourist Attraction Planner
   DAA Project | Algorithms:
     1. Greedy            -> locally optimal attraction selection
     2. 0/1 Knapsack (2D) -> global optimisation under TIME + BUDGET
     3. Graph (Dijkstra/BFS/DFS + NN + 2-opt) -> feasible visit order & route
   All results are computed from real user input. No hard-coded outputs.
   ========================================================================== */

/* ---------------------------------------------------------------------------
   0. ICONS  (inline SVG, Lucide-style)
   ------------------------------------------------------------------------- */
const I = {
  dashboard:<><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></>,
  compass:<><circle cx="12" cy="12" r="9"/><path d="M15.6 8.4 13.3 13.3 8.4 15.6l2.3-4.9z"/></>,
  route:<><circle cx="5.5" cy="5.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/><path d="M8 5.5h6a3.5 3.5 0 0 1 0 7H9a3.5 3.5 0 0 0 0 7h7"/></>,
  pin:<><path d="M12 21.5s7-6.2 7-11.5a7 7 0 1 0-14 0c0 5.3 7 11.5 7 11.5z"/><circle cx="12" cy="10" r="2.6"/></>,
  cpu:<><rect x="6" y="6" width="12" height="12" rx="2.5"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></>,
  chart:<><path d="M3 21h18"/><rect x="5" y="12" width="3.4" height="6" rx="1"/><rect x="10.3" y="8" width="3.4" height="10" rx="1"/><rect x="15.6" y="4" width="3.4" height="14" rx="1"/></>,
  map:<><path d="M9 20.5 3 17.5V4l6 3 6-3 6 3v13.5l-6-3-6 3z"/><path d="M9 7v13.5M15 4v13.5"/></>,
  info:<><circle cx="12" cy="12" r="9"/><path d="M12 11.2V16M12 8h.01"/></>,
  play:<><path d="M8 5.4v13.2L19 12z"/></>,
  pause:<><rect x="7" y="5" width="3.4" height="14" rx="1.2"/><rect x="13.6" y="5" width="3.4" height="14" rx="1.2"/></>,
  next:<><path d="M6 5.4v13.2L15 12z"/><path d="M18.5 5v14"/></>,
  reset:<><path d="M3.5 12a8.5 8.5 0 1 0 2.7-6.2"/><path d="M3 4v5h5"/></>,
  plus:<><path d="M12 5.5v13M5.5 12h13"/></>,
  trash:<><path d="M4 7h16M9.5 7V4.8h5V7M6.5 7l1 13h9l1-13"/></>,
  edit:<><path d="M4 20.2h4.2L20 8.4 15.8 4.2 4 16v4.2z"/><path d="M14.5 5.5 18.7 9.7"/></>,
  search:<><circle cx="11" cy="11" r="7"/><path d="m20.5 20.5-4-4"/></>,
  check:<><path d="m5 12.8 4.4 4.4L19 6.6"/></>,
  x:<><path d="M6 6l12 12M18 6 6 18"/></>,
  chevD:<><path d="m6 9.5 6 6 6-6"/></>,
  chevR:<><path d="m9.5 6 6 6-6 6"/></>,
  chevL:<><path d="m14.5 6-6 6 6 6"/></>,
  menu:<><path d="M4 7h16M4 12h16M4 17h16"/></>,
  clock:<><circle cx="12" cy="12" r="9"/><path d="M12 6.8v5.6l3.4 2"/></>,
  wallet:<><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.2h18"/><circle cx="17" cy="14.6" r="1.2"/></>,
  star:<><path d="m12 3.4 2.7 5.5 6 .9-4.4 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.3 9.8l6-.9z"/></>,
  target:<><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1"/></>,
  zap:<><path d="M13.5 2 4.5 13.6h5.6L9.4 22l9.1-11.6h-5.6z"/></>,
  branch:<><circle cx="6.5" cy="6" r="2.5"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6.5 8.5v7M9 6h4.2a4.8 4.8 0 0 1 4.8 4.8v.2"/></>,
  layers:<><path d="m12 3 9 5-9 5-9-5z"/><path d="m3.5 13.2 8.5 4.8 8.5-4.8"/></>,
  activity:<><path d="M3 12.5h4l2.6 7L14 4.5l2.4 8H21"/></>,
  sparkle:<><path d="M12 3.5 13.9 9 19.5 11l-5.6 2L12 18.5 10.1 13 4.5 11 10.1 9z"/><path d="M18.5 3.5v3M20 5h-3"/></>,
  arrowR:<><path d="M4.5 12h14M13 6.2 18.8 12 13 17.8"/></>,
  arrowD:<><path d="M12 4.5v14M6.2 13 12 18.8 17.8 13"/></>,
  trend:<><path d="M3 17.2 9.5 10.7l4 4L21 7"/><path d="M15.5 7H21v5.5"/></>,
  users:<><circle cx="9" cy="8" r="3.3"/><path d="M2.8 20a6.2 6.2 0 0 1 12.4 0"/><path d="M16.5 5.4a3.3 3.3 0 0 1 0 6.4M18 20a6.2 6.2 0 0 0-2.4-4.9"/></>,
  calendar:<><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></>,
  filter:<><path d="M3.5 5h17l-6.6 7.6V19l-3.8-2v-4.4z"/></>,
  fit:<><path d="M4 9.5V4h5.5M20 9.5V4h-5.5M4 14.5V20h5.5M20 14.5V20h-5.5"/></>,
  eye:<><path d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/></>,
  table:<><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M3 9.5h18M9 9.5v10M3 14.5h18"/></>,
  flag:<><path d="M5.5 21V4M5.5 5.2h11l-2 3.4 2 3.4h-11"/></>,
  db:<><ellipse cx="12" cy="6" rx="8" ry="3.2"/><path d="M4 6v6c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2V6"/><path d="M4 12v6c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2v-6"/></>,
  compass2:<><circle cx="12" cy="12" r="9"/><path d="m15.4 8.6-2 5.4-5.4 2 2-5.4z"/></>,
  shuffle:<><path d="M16 4h4v4"/><path d="M4 20 20 4"/><path d="M16 20h4v-4"/><path d="m4 4 5 5"/></>,
};

function Icon({ name, size = 20, className = '', sw = 1.8 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
      strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={className}>
      {I[name] || I.info}
    </svg>
  );
}

/* ---------------------------------------------------------------------------
   1. UTILITIES
   ------------------------------------------------------------------------- */
const uid = () => Math.random().toString(36).slice(2, 9);
const INR = (n) => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const HRS = (h) => (Math.round((Number(h) || 0) * 10) / 10) + 'h';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const round1 = (v) => Math.round(v * 10) / 10;

const AVG_SPEED_KMH = 25;              // assumed average city travel speed
const travelHours = (km) => km / AVG_SPEED_KMH;

/** Great-circle distance between two {lat,lng} points, in km. */
function haversine(a, b) {
  if (!a || !b) return 0;
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const la1 = a.lat * Math.PI / 180, la2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(la1) * Math.cos(la2) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

const toMinutes = (hhmm) => {
  const [h, m] = String(hhmm || '09:00').split(':').map(Number);
  return (h || 0) * 60 + (m || 0);
};
const fromMinutes = (mins) => {
  const m = ((Math.round(mins) % 1440) + 1440) % 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
};

/* ---------------------------------------------------------------------------
   2. ALGORITHMS
   ------------------------------------------------------------------------- */

/* ---------- 2.1 GREEDY -----------------------------------------------------
   Score metric (documented & displayed in the UI):
     costNorm  = (cost / budget) * totalTime        // converts money -> hours
     efficiency= value / (duration + costNorm)
   The preference switch changes the greedy criterion, but the feasibility
   rule is always the same: the attraction must fit in BOTH remaining
   time and remaining budget.
--------------------------------------------------------------------------- */
function runGreedy(attractions, { budget, time, preference }) {
  const steps = [];
  const evaluated = attractions.map((a) => {
    const costNorm = budget > 0 ? (a.cost / budget) * time : 0;
    const efficiency = a.value / (a.duration + costNorm + 1e-6);
    let score, metricLabel;
    switch (preference) {
      case 'attractions':
        score = 1 / (a.duration + costNorm + 1e-6);
        metricLabel = '1 / (Duration + CostNorm)';
        break;
      case 'priority':
        score = a.priority;
        metricLabel = 'Priority (1-10)';
        break;
      case 'value':
        score = a.value;
        metricLabel = 'Value (0-100)';
        break;
      default:
        score = efficiency;
        metricLabel = 'Value / (Duration + CostNorm)';
    }
    return { ...a, costNorm, efficiency, score, metricLabel };
  });

  steps.push({ phase: 'EVALUATE', title: 'Evaluate candidate attractions',
    detail: `${attractions.length} attraction(s) loaded. Constraints → Time ${HRS(time)}, Budget ${INR(budget)}.` });

  steps.push({ phase: 'SCORE', title: 'Calculate efficiency score',
    detail: `Metric: ${evaluated[0]?.metricLabel || 'n/a'} — costNormalised = (cost / budget) × totalTime.` });

  const sorted = [...evaluated].sort((x, y) => y.score - x.score);
  steps.push({ phase: 'SORT', title: 'Sort candidates by score (descending)',
    detail: sorted.length ? sorted.map((s) => `${s.name} (${s.score.toFixed(2)})`).join('  ›  ') : 'No candidates.' });

  let remTime = time, remBudget = budget, totalValue = 0, totalCost = 0, totalDuration = 0;
  const selected = [], decisions = [];

  sorted.forEach((it, idx) => {
    let ok = false, reason = '';
    if (it.duration > remTime + 1e-9) {
      reason = `Rejected — requires ${HRS(it.duration)} but only ${HRS(remTime)} remain.`;
    } else if (it.cost > remBudget + 1e-9) {
      reason = `Rejected because remaining budget (${INR(remBudget)}) is insufficient for ${INR(it.cost)}.`;
    } else {
      ok = true;
      remTime -= it.duration; remBudget -= it.cost;
      totalValue += it.value; totalCost += it.cost; totalDuration += it.duration;
      selected.push(it);
      reason = `Selected — fits within remaining time and budget.`;
    }
    decisions.push({ ...it, order: idx, decision: ok, reason, remTimeAfter: remTime, remBudgetAfter: remBudget });
    steps.push({
      phase: ok ? 'SELECT' : 'REJECT',
      title: `${ok ? 'Select' : 'Skip'} "${it.name}"`,
      detail: `${reason}  Remaining → ${HRS(remTime)} · ${INR(remBudget)}`
    });
  });

  steps.push({ phase: 'DONE', title: 'Constraints reached — greedy terminated',
    detail: `Selected ${selected.length} attraction(s) · Value ${totalValue} · Cost ${INR(totalCost)} · Time ${HRS(totalDuration)}` });

  return {
    algorithm: 'Greedy',
    selected, decisions, steps, sorted,
    totalValue, totalCost, totalTime: totalDuration,
    remTime, remBudget,
    complexity: { time: 'O(n log n)', space: 'O(n)' },
  };
}

/* ---------- 2.2 0/1 KNAPSACK (two constraints) -----------------------------
   State: dp[t][b] = maximum profit achievable using the items processed so far
   with at most `t` time-units and `b` budget-units.
   Transition (0/1 → reverse iteration to avoid reusing an item):
      dp[t][b] = max(dp[t][b], dp[t - tw][b - bw] + profit)
   Discretisation: 1 time unit = 0.5 h, 1 budget unit = ₹25.
--------------------------------------------------------------------------- */
const TIME_UNIT = 0.5;   // hours
const BUDGET_UNIT = 25;  // ₹

function runKnapsack(attractions, { budget, time, preference }) {
  const T = Math.max(1, Math.round(time / TIME_UNIT));
  const B = Math.max(1, Math.round(budget / BUDGET_UNIT));

  const profitOf = (a) =>
    preference === 'attractions' ? 1 :
    preference === 'priority' ? a.priority :
    a.value;

  const items = [], infeasible = [];
  attractions.forEach((a) => {
    const tw = Math.max(1, Math.ceil(a.duration / TIME_UNIT));
    const bw = Math.max(1, Math.ceil(a.cost / BUDGET_UNIT));
    const item = { ...a, tw, bw, profit: profitOf(a) };
    if (tw > T) infeasible.push({ ...item, reason: `Duration ${HRS(a.duration)} exceeds total available time ${HRS(time)}.` });
    else if (bw > B) infeasible.push({ ...item, reason: `Cost ${INR(a.cost)} exceeds total budget ${INR(budget)}.` });
    else items.push(item);
  });

  const n = items.length;
  const dp = Array.from({ length: T + 1 }, () => new Float64Array(B + 1));
  const take = Array.from({ length: n }, () => Array.from({ length: T + 1 }, () => new Uint8Array(B + 1)));
  const snapshots = [];

  for (let i = 0; i < n; i++) {
    const it = items[i];
    for (let t = T; t >= it.tw; t--) {
      const rowT = dp[t], rowTw = dp[t - it.tw], tk = take[i][t];
      for (let b = B; b >= it.bw; b--) {
        const cand = rowTw[b - it.bw] + it.profit;
        if (cand > rowT[b] + 1e-9) { rowT[b] = cand; tk[b] = 1; }
      }
    }
    snapshots.push({ itemIndex: i, itemName: it.name, grid: dp.map((r) => Array.from(r)) });
  }

  // ---- reconstruct the chosen set ----
  let t = T, b = B;
  const chosen = [];
  for (let i = n - 1; i >= 0; i--) {
    if (take[i][t][b]) { chosen.push(items[i]); t -= items[i].tw; b -= items[i].bw; }
  }
  chosen.reverse();

  const totalValue = chosen.reduce((s, x) => s + x.value, 0);
  const totalProfit = chosen.reduce((s, x) => s + x.profit, 0);
  const totalCost = chosen.reduce((s, x) => s + x.cost, 0);
  const totalTime = chosen.reduce((s, x) => s + x.duration, 0);

  return {
    algorithm: 'Knapsack',
    selected: chosen, infeasible, snapshots,
    T, B, grid: dp.map((r) => Array.from(r)),
    totalValue, totalProfit, totalCost, totalTime,
    unusedTime: Math.max(0, time - totalTime),
    unusedBudget: Math.max(0, budget - totalCost),
    objective: preference === 'attractions' ? 'Maximise attraction count'
             : preference === 'priority' ? 'Maximise total priority'
             : 'Maximise total value',
    complexity: { time: `O(n · T · B) = O(${n} × ${T} × ${B})`, space: `O(T · B) = O(${T} × ${B})` },
  };
}

/* ---------- 2.3 GRAPH ------------------------------------------------------ */
function buildGraph(nodes) {
  const edges = [];
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const d = haversine(nodes[i], nodes[j]);
      edges.push({ a: nodes[i].id, b: nodes[j].id, dist: d, time: travelHours(d) });
    }
  }
  const adj = {};
  nodes.forEach((n) => (adj[n.id] = []));
  edges.forEach((e) => {
    adj[e.a].push({ to: e.b, w: e.time, d: e.dist });
    adj[e.b].push({ to: e.a, w: e.time, d: e.dist });
  });
  return { nodes, edges, adj };
}

/** Dijkstra — shortest travel time from `startId` to every node. O(V²) array PQ. */
function dijkstra(graph, startId) {
  const dist = {}, prev = {}, visited = new Set(), order = [];
  graph.nodes.forEach((n) => (dist[n.id] = Infinity));
  dist[startId] = 0;
  while (true) {
    let u = null, best = Infinity;
    graph.nodes.forEach((n) => { if (!visited.has(n.id) && dist[n.id] < best) { best = dist[n.id]; u = n.id; } });
    if (u === null) break;
    visited.add(u); order.push(u);
    graph.adj[u].forEach((e) => {
      const nd = dist[u] + e.w;
      if (nd < dist[e.to] - 1e-9) { dist[e.to] = nd; prev[e.to] = u; }
    });
  }
  return { dist, prev, order };
}

function bfs(graph, startId) {
  const seen = new Set([startId]), q = [startId], order = [];
  while (q.length) {
    const u = q.shift(); order.push(u);
    graph.adj[u].forEach((e) => { if (!seen.has(e.to)) { seen.add(e.to); q.push(e.to); } });
  }
  return order;
}
function dfs(graph, startId) {
  const seen = new Set(), order = [];
  (function go(u) { seen.add(u); order.push(u); graph.adj[u].forEach((e) => { if (!seen.has(e.to)) go(e.to); }); })(startId);
  return order;
}

/** 2-opt local search on an open path (index 0 = start, kept fixed). */
function twoOpt(path) {
  const cost = (p) => { let s = 0; for (let i = 0; i < p.length - 1; i++) s += haversine(p[i], p[i + 1]); return s; };
  let best = cost(path), improved = true, guard = 0;
  const n = path.length;
  while (improved && guard++ < 80) {
    improved = false;
    for (let i = 1; i < n - 1; i++) {
      for (let k = i + 1; k < n; k++) {
        const cand = path.slice(0, i).concat(path.slice(i, k + 1).reverse(), path.slice(k + 1));
        const d = cost(cand);
        if (d + 1e-9 < best) { best = d; path = cand; improved = true; }
      }
    }
  }
  return { path, distance: best };
}

/** Build the visit order (nearest-neighbour + 2-opt) and the timed itinerary. */
function buildRoute(startNode, stops, startClock = '09:00') {
  if (!stops || stops.length === 0) {
    return { legs: [], path: [startNode], totalDist: 0, totalTravel: 0, nnDistance: 0 };
  }
  // --- nearest neighbour construction ---
  const remaining = [...stops];
  let cur = startNode;
  const nnPath = [startNode];
  while (remaining.length) {
    let bi = 0, bd = Infinity;
    remaining.forEach((s, i) => { const d = haversine(cur, s); if (d < bd) { bd = d; bi = i; } });
    const nx = remaining.splice(bi, 1)[0];
    nnPath.push(nx); cur = nx;
  }
  const nnDistance = nnPath.slice(1).reduce((s, n, i) => s + haversine(nnPath[i], n), 0);
  // --- 2-opt improvement ---
  const { path, distance } = twoOpt(nnPath);

  const legs = [];
  let clock = toMinutes(startClock), totalDist = 0, totalTravel = 0;
  for (let i = 1; i < path.length; i++) {
    const from = path[i - 1], to = path[i];
    const d = haversine(from, to);
    const th = travelHours(d);
    totalDist += d; totalTravel += th;
    clock += th * 60;
    const arrival = clock;
    clock += (to.duration || 0) * 60;
    legs.push({ seq: i, node: to, from, distance: d, travel: th, arrival, depart: clock });
  }
  return { legs, path, totalDist, totalTravel, nnDistance };
}

function CountUp({ value, duration = 900, prefix = '', suffix = '', decimals = 0 }) {
  const [d, setD] = useState(0);
  const raf = useRef();
  useEffect(() => {
    const from = 0, to = Number(value) || 0, t0 = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - t0) / duration);
      const e = 1 - Math.pow(1 - p, 3);
      setD(from + (to - from) * e);
      if (p < 1) raf.current = requestAnimationFrame(tick);
    };
    raf.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf.current);
  }, [value, duration]);
  const shown = decimals > 0 ? d.toFixed(decimals) : Math.round(d).toLocaleString('en-IN');
  return <span>{prefix}{shown}{suffix}</span>;
}

function ProgressRing({ value, max, size = 132, stroke = 11, color = '#22d3ee', trackColor = 'rgba(148,163,184,.14)', label, center, sub }) {

  const circ = 2 * Math.PI * r;
  const [off, setOff] = useState(circ);
  useEffect(() => { const t = setTimeout(() => setOff(circ - (pct / 100) * circ), 90); return () => clearTimeout(t); }, [pct, circ]);
  return (
    <div className="flex flex-col items-center">
      <div className="relative" style={{ width: size, height: size }}>
        <svg width={size} height={size} className="-rotate-90">
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={trackColor} strokeWidth={stroke} />
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={color} strokeWidth={stroke}
            strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={off}
            className="ring-anim" style={{ filter: `drop-shadow(0 0 8px ${color}88)` }} />

          <div className="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-xl glass-soft">
            <Icon name="clock" size={14} className="text-violet-300" />
            <span className="text-[11.5px] mono text-slate-300">{HRS(trip?.time || 0)}</span>
          </div>
          <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-400/25 to-violet-500/25 border border-cyan-400/25 grid place-items-center text-cyan-200">
            <Icon name="users" size={16} />
          </div>
        </div>
      </div>
    </header>
  );
}

function Toasts({ items, dismiss }) {
  return (
    <div className="fixed bottom-4 right-4 z-[100] space-y-2 w-[min(92vw,360px)]">
      {items.map((t) => (
        <div key={t.id} className="pop-in glass rounded-xl px-4 py-3 flex items-start gap-3 glow-border">
          <div className={`w-7 h-7 rounded-lg grid place-items-center shrink-0 mt-0.5
            ${t.type === 'error' ? 'bg-rose-500/15 text-rose-300' :
              t.type === 'success' ? 'bg-emerald-500/15 text-emerald-300' : 'bg-cyan-500/15 text-cyan-300'}`}>
            <Icon name={t.type === 'error' ? 'x' : t.type === 'success' ? 'check' : 'info'} size={15} />
          </div>
          <p className="text-[12.5px] text-slate-200 leading-snug flex-1">{t.msg}</p>
          <button onClick={() => dismiss(t.id)} className="text-slate-500 hover:text-slate-200 transition">
            <Icon name="x" size={14} />
          </button>
        </div>
      ))}
    </div>
  );
}

/* ---------------------------------------------------------------------------
   6. DASHBOARD
   ------------------------------------------------------------------------- */
function Dashboard({ attractions, trip, result, go }) {
  const selectedCount = result ? result.knapsack.selected.length : 0;
  const totalValue = result ? result.knapsack.totalValue : 0;

  const algoCards = [
    {
      key: 'greedy', name: 'GREEDY', icon: 'zap', tone: 'cyan',
      desc: 'Selects the best locally feasible attraction based on priority / value efficiency.',
      complexity: 'O(n log n)',
      points: ['Sort by score', 'Feasibility check', 'Fast, no guarantee of global optimum'],
    },
    {
      key: 'knapsack', name: '0/1 KNAPSACK', icon: 'layers', tone: 'violet',
      desc: 'Maximises total attraction value under both time and budget constraints.',
      complexity: 'O(n · T · B)',
      points: ['2-dimensional DP', 'Guaranteed optimum', 'Uses discretised time & cost units'],
    },
    {
      key: 'graph', name: 'GRAPH TRAVERSAL', icon: 'branch', tone: 'emerald',
      desc: 'Generates a feasible visit order and shortest route between the selected attractions.',
      complexity: 'O(V²) Dijkstra · O(V²) 2-opt',
      points: ['BFS / DFS traversal', 'Dijkstra shortest path', 'Nearest-neighbour + 2-opt route'],
    },
  ];

  return (
    <div className="space-y-6 sm:space-y-8 fade-in">
      {/* HERO */}
      <Card hover={false} className="relative overflow-hidden p-6 sm:p-10">
        <div className="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-cyan-500/15 blur-3xl pointer-events-none" />
        <div className="absolute -bottom-28 -left-20 w-72 h-72 rounded-full bg-violet-600/15 blur-3xl pointer-events-none" />
        <div className="relative grid lg:grid-cols-[1.15fr_.85fr] gap-8 items-center">
          <div>
            <Chip tone="cyan" className="!text-[10.5px] !px-3 !py-1">
              <Icon name="sparkle" size={12} /> DAA PROJECT · SMART TOURISM
            </Chip>
            <h1 className="font-display font-black text-[34px] sm:text-5xl lg:text-[54px] leading-[1.02] tracking-tight mt-5">
              <span className="text-slate-50">PLAN SMARTER.</span><br />
              <span className="grad-text">EXPLORE MORE.</span>
            </h1>
            <p className="text-slate-400 text-[13.5px] sm:text-[15px] leading-relaxed mt-4 max-w-xl">
              An intelligent tourist attraction planner that combines <span className="text-cyan-300 font-medium">Greedy Optimization</span>,{' '}
              <span className="text-violet-300 font-medium">Knapsack Dynamic Programming</span> and{' '}
              <span className="text-emerald-300 font-medium">Graph Algorithms</span> to create feasible and optimised travel plans.
            </p>
            <div className="flex flex-wrap gap-3 mt-7">
              <button onClick={() => go('plan')} className="btn btn-primary">
                <Icon name="play" size={16} /> Start Planning
              </button>
              <button onClick={() => go('algorithms')} className="btn btn-ghost">
                <Icon name="cpu" size={16} /> Explore Algorithms
              </button>
            </div>
          </div>

          {/* Animated map illustration */}
          <div className="relative h-[260px] sm:h-[300px] rounded-2xl glass-soft overflow-hidden">
            <svg viewBox="0 0 400 300" className="w-full h-full">
              <defs>
                <linearGradient id="ln" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stopColor="#22d3ee" /><stop offset="100%" stopColor="#8b5cf6" />
                </linearGradient>
                <radialGradient id="glow">
                  <stop offset="0%" stopColor="#22d3ee" stopOpacity=".55" />
                  <stop offset="100%" stopColor="#22d3ee" stopOpacity="0" />
                </radialGradient>
              </defs>
              {Array.from({ length: 9 }).map((_, i) => (
                <line key={'h' + i} x1="0" y1={i * 34} x2="400" y2={i * 34} stroke="rgba(56,189,248,.07)" />
              ))}
              {Array.from({ length: 12 }).map((_, i) => (
                <line key={'v' + i} x1={i * 34} y1="0" x2={i * 34} y2="300" stroke="rgba(56,189,248,.07)" />
              ))}
              <path d="M60 230 L130 160 L210 195 L280 110 L340 150" fill="none" stroke="url(#ln)" strokeWidth="2.5"
                strokeLinecap="round" className="route-flow" opacity=".95" />
              {[[60,230],[130,160],[210,195],[280,110],[340,150]].map(([x,y],i)=>(
                <g key={i}>
                  <circle cx={x} cy={y} r="22" fill="url(#glow)" />
                  <circle cx={x} cy={y} r="6.5" fill="#0b1120" stroke="#22d3ee" strokeWidth="2.5" />
                  <circle cx={x} cy={y} r="2.4" fill="#67e8f9" />
                </g>
              ))}
            </svg>
            <div className="absolute top-3 left-3 glass rounded-xl px-3 py-2">
              <div className="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Attractions</div>
              <div className="font-display font-bold text-cyan-300 text-lg leading-none mt-0.5">{attractions.length}</div>
            </div>
            <div className="absolute bottom-3 right-3 glass rounded-xl px-3 py-2">
              <div className="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Optimised Route</div>
              <div className="font-display font-bold text-violet-300 text-[13px] leading-none mt-1">
                {result ? `${result.knapsack.selected.length} stops` : 'Not generated'}
              </div>
            </div>
          </div>
        </div>
      </Card>

      {/* STATS */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
        <StatCard icon="pin" label="Total Attractions" value={attractions.length} accent="cyan" delay={0} />
        <StatCard icon="wallet" label="Available Budget" value={trip.budget} prefix="₹" accent="violet" delay={70} />
        <StatCard icon="clock" label="Available Time" value={trip.time} suffix="h" decimals={1} accent="amber" delay={140} />
        <StatCard icon="check" label="Selected Attractions" value={selectedCount} accent="emerald" delay={210}
          sub={result ? `Value ${totalValue} · ${HRS(result.knapsack.totalTime)} visit time` : 'Run the planner'} />
      </div>

      {/* ALGORITHM ENGINE */}
      <div>
        <SectionTitle icon="cpu" title="Algorithm Engine" subtitle="Three algorithms power the planner — each with a different role." />
        <div className="grid md:grid-cols-3 gap-4">
          {algoCards.map((a, i) => {
            const tones = {
              cyan: 'from-cyan-500/15 to-transparent text-cyan-300 border-cyan-400/25',
              violet: 'from-violet-500/15 to-transparent text-violet-300 border-violet-400/25',
              emerald: 'from-emerald-500/15 to-transparent text-emerald-300 border-emerald-400/25',
            };
            return (
              <Card key={a.key} className="p-5 flex flex-col fade-in" style={{ animationDelay: `${i * 90}ms` }}>
                <div className={`w-11 h-11 rounded-xl bg-gradient-to-br border grid place-items-center ${tones[a.tone]}`}>
                  <Icon name={a.icon} size={20} />
                </div>
                <h3 className="font-display font-extrabold text-[15px] tracking-wide mt-4 text-slate-100">{a.name}</h3>
                <p className="text-[12.5px] text-slate-400 leading-relaxed mt-2 flex-1">{a.desc}</p>
                <ul className="mt-3 space-y-1.5">
                  {a.points.map((p) => (
                    <li key={p} className="flex items-start gap-2 text-[11.5px] text-slate-500">
                      <Icon name="check" size={12} className="text-cyan-400 mt-0.5 shrink-0" /> {p}
                    </li>
                  ))}
                </ul>
                <div className="flex items-center justify-between mt-4 pt-3 border-t border-slate-700/40">
                  <span className="mono text-[11px] text-amber-300/90">{a.complexity}</span>
                  <button onClick={() => go('algorithms')} className="text-[11.5px] font-semibold text-cyan-300 hover:text-cyan-100 flex items-center gap-1 transition">
                    View Algorithm <Icon name="arrowR" size={13} />
                  </button>
                </div>
              </Card>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------------
   7. PLAN TRIP
   ------------------------------------------------------------------------- */
function AttractionRow({ a, idx, onChange, onRemove, errors }) {
  const set = (k, v) => onChange(a.id, k, v);
  const err = (k) => errors && errors[a.id] && errors[a.id][k];
  const num = (k, v, min, max) => {
    let n = parseFloat(v);
    if (isNaN(n)) n = '';
    if (typeof n === 'number') n = clamp(n, min, max);
    set(k, n);
  };
  return (
    <div className="glass-soft rounded-xl p-4 relative group">
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2">
          <span className="w-6 h-6 rounded-lg bg-gradient-to-br from-cyan-500/25 to-violet-500/25 border border-cyan-400/25 grid place-items-center text-[10.5px] font-bold text-cyan-200 mono">
            {idx + 1}
          </span>
          <span className="text-[12.5px] font-semibold text-slate-300 truncate max-w-[160px]">{a.name || 'Unnamed attraction'}</span>
        </div>
        <button onClick={() => onRemove(a.id)} className="w-8 h-8 rounded-lg grid place-items-center text-slate-500 hover:text-rose-300 hover:bg-rose-500/10 transition">
          <Icon name="trash" size={15} />
        </button>
      </div>
      <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
        <div className="col-span-2">
          <label className="lbl">Name</label>
          <input className={`inp ${err('name') ? 'inp-err' : ''}`} value={a.name} placeholder="Attraction name"
            onChange={(e) => set('name', e.target.value)} />
        </div>
        <div className="col-span-2">
          <label className="lbl">Location</label>
          <input className={`inp ${err('location') ? 'inp-err' : ''}`} value={a.location} placeholder="Area / city"
            onChange={(e) => set('location', e.target.value)} />
        </div>
        <div>
          <label className="lbl">Duration (h)</label>
          <input type="number" step="0.5" min="0.5" className={`inp ${err('duration') ? 'inp-err' : ''}`} value={a.duration}
            onChange={(e) => num('duration', e.target.value, 0.1, 48)} />
        </div>
        <div>
          <label className="lbl">Cost (₹)</label>
          <input type="number" min="0" step="10" className={`inp ${err('cost') ? 'inp-err' : ''}`} value={a.cost}
            onChange={(e) => num('cost', e.target.value, 0, 1000000)} />
        </div>
        <div>
          <label className="lbl">Priority</label>
          <input type="number" min="1" max="10" className={`inp ${err('priority') ? 'inp-err' : ''}`} value={a.priority}
            onChange={(e) => num('priority', e.target.value, 1, 10)} />
        </div>
        <div>
          <label className="lbl">Value</label>
          <input type="number" min="0" max="100" className={`inp ${err('value') ? 'inp-err' : ''}`} value={a.value}
            onChange={(e) => num('value', e.target.value, 0, 100)} />
        </div>
        <div>
          <label className="lbl">Latitude</label>
          <input type="number" step="0.0001" className={`inp ${err('lat') ? 'inp-err' : ''}`} value={a.lat}
            onChange={(e) => set('lat', parseFloat(e.target.value) || 0)} />
        </div>
        <div>
          <label className="lbl">Longitude</label>
          <input type="number" step="0.0001" className={`inp ${err('lng') ? 'inp-err' : ''}`} value={a.lng}
            onChange={(e) => set('lng', parseFloat(e.target.value) || 0)} />
        </div>
      </div>
      {err('name') && <p className="text-[11px] text-rose-400 mt-2">{err('name')}</p>}
    </div>
  );
}

function PlanTrip({ trip, setTrip, attractions, setAttractions, onGenerate, running, progress, runStep, notify, onLoadDemo, onReset }) {
  const [errors, setErrors] = useState({});

  const setTripField = (k, v) => setTrip((t) => ({ ...t, [k]: v }));
  const updateAttr = (id, k, v) => setAttractions((list) => list.map((a) => (a.id === id ? { ...a, [k]: v } : a)));
  const removeAttr = (id) => {
    setAttractions((list) => list.filter((a) => a.id !== id));
    notify('Attraction removed', 'info');
  };
  const addAttr = () => {
    setAttractions((list) => [...list, {
      id: uid(), name: '', location: '', duration: 1, cost: 100, priority: 5, value: 50,
      lat: 17.385, lng: 78.4867,
    }]);
  };

  /* ---- validation ---- */
  const validate = () => {
    const e = {};
    const tripErr = {};
    if (!trip.name.trim()) tripErr.name = 'Trip name is required';
    if (!trip.startLocation.trim()) tripErr.startLocation = 'Starting location is required';
    if (!(trip.time > 0)) tripErr.time = 'Available time must be greater than 0';
    if (!(trip.budget > 0)) tripErr.budget = 'Budget must be greater than 0';
    if (Object.keys(tripErr).length) e.__trip = tripErr;

    const perAttr = {};
    attractions.forEach((a) => {
      const ae = {};
      if (!a.name.trim()) ae.name = 'Name required';
      if (!a.location.trim()) ae.location = 'Location required';
      if (!(a.duration > 0)) ae.duration = 'Must be > 0';
      if (a.cost < 0) ae.cost = 'Cannot be negative';
      if (!(a.priority >= 1 && a.priority <= 10)) ae.priority = '1 – 10';
      if (!(a.value >= 0 && a.value <= 100)) ae.value = '0 – 100';
      if (Math.abs(a.lat) > 90) ae.lat = 'Invalid';
      if (Math.abs(a.lng) > 180) ae.lng = 'Invalid';
      if (Object.keys(ae).length) perAttr[a.id] = ae;
    });
    e.attrs = perAttr;
    return e;
  };

  const handleGenerate = () => {
    const e = validate();
    setErrors(e);
    const msgs = [];
    if (e.__trip) msgs.push(...Object.values(e.__trip));
    Object.values(e.attrs || {}).forEach((o) => msgs.push(...Object.values(o)));
    if (attractions.length === 0) msgs.push('Add at least one attraction before generating a plan.');
    if (msgs.length) {
      [...new Set(msgs)].slice(0, 4).forEach((m) => notify(m, 'error'));
      return;
    }
    const feasible = attractions.filter((a) => a.duration <= trip.time && a.cost <= trip.budget);
    if (feasible.length === 0) {
      notify('No feasible attractions found within the current time and budget constraints. Try increasing your budget or available time.', 'error');
      return;
    }
    onGenerate();
  };

  const tripErr = errors.__trip || {};

  return (
    <div className="space-y-6 fade-in">
      {/* ---- Trip parameters ---- */}
      <Card hover={false} className="p-5 sm:p-6">
        <SectionTitle icon="route" title="Trip Parameters"
          subtitle="Define your constraints — the algorithms optimise against these values."
          right={
            <div className="flex gap-2">
              <button onClick={onLoadDemo} className="btn btn-ghost !px-3 !py-2 !text-[12px]">
                <Icon name="db" size={14} /> Load Demo Data
              </button>
              <button onClick={onReset} className="btn btn-ghost !px-3 !py-2 !text-[12px]">
                <Icon name="reset" size={14} /> Reset Project
              </button>
            </div>
          } />

        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          <div className="lg:col-span-2">
            <label className="lbl">Trip Name</label>
            <input className={`inp ${tripErr.name ? 'inp-err' : ''}`} value={trip.name}
              onChange={(e) => setTripField('name', e.target.value)} placeholder="e.g. Hyderabad Heritage Tour" />
          </div>
          <div>
            <label className="lbl">Starting Location</label>
            <input className={`inp ${tripErr.startLocation ? 'inp-err' : ''}`} value={trip.startLocation}
              onChange={(e) => setTripField('startLocation', e.target.value)} placeholder="e.g. Hyderabad City Center" />
          </div>
          <div>
            <label className="lbl">Start Time</label>
            <input type="time" className="inp" value={trip.startClock}
              onChange={(e) => setTripField('startClock', e.target.value)} />
          </div>
          <div>
            <label className="lbl">Available Time (hours)</label>
            <input type="number" min="0.5" step="0.5" className={`inp ${tripErr.time ? 'inp-err' : ''}`} value={trip.time}
              onChange={(e) => setTripField('time', clamp(parseFloat(e.target.value) || 0, 0, 72))} />
          </div>
          <div>
            <label className="lbl">Maximum Budget (₹)</label>
            <input type="number" min="0" step="50" className={`inp ${tripErr.budget ? 'inp-err' : ''}`} value={trip.budget}
              onChange={(e) => setTripField('budget', clamp(parseFloat(e.target.value) || 0, 0, 10000000))} />
          </div>
          <div>
            <label className="lbl">Start Latitude</label>
            <input type="number" step="0.0001" className="inp" value={trip.startLat}
              onChange={(e) => setTripField('startLat', parseFloat(e.target.value) || 0)} />
          </div>
          <div>
            <label className="lbl">Start Longitude</label>
            <input type="number" step="0.0001" className="inp" value={trip.startLng}
              onChange={(e) => setTripField('startLng', parseFloat(e.target.value) || 0)} />
          </div>
        </div>

        <div className="mt-5">
          <label className="lbl">Optimization Preference</label>
          <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
            {PREFERENCES.map((p) => {
              const active = trip.preference === p.key;
              return (
                <button key={p.key} onClick={() => setTripField('preference', p.key)}
                  className={`text-left rounded-xl p-3 border transition-all
                    ${active ? 'border-cyan-400/50 bg-cyan-500/10 shadow-[0_0_25px_-8px_rgba(34,211,238,.7)]'
                             : 'border-slate-700/50 bg-white/[.02] hover:border-cyan-400/30'}`}>
                  <div className="flex items-center gap-2">
                    <span className={`w-3.5 h-3.5 rounded-full border-2 grid place-items-center ${active ? 'border-cyan-400' : 'border-slate-600'}`}>
                      {active && <span className="w-1.5 h-1.5 rounded-full bg-cyan-400" />}
                    </span>
                    <span className={`text-[12.5px] font-semibold ${active ? 'text-cyan-200' : 'text-slate-300'}`}>{p.label}</span>
                  </div>
                  <p className="text-[11px] text-slate-500 mt-1.5 leading-snug">{p.desc}</p>
                </button>
              );
            })}
          </div>
        </div>
      </Card>

      {/* ---- Attractions ---- */}
      <Card hover={false} className="p-5 sm:p-6">
        <SectionTitle icon="pin" title={`Attractions (${attractions.length})`}
          subtitle="Edit each attraction's duration, cost, priority, value and coordinates."
          right={
            <button onClick={addAttr} className="btn btn-ghost !px-3 !py-2 !text-[12px]">
              <Icon name="plus" size={14} /> Add Attraction
            </button>
          } />
        {attractions.length === 0 ? (
          <EmptyState icon="pin" title="No attractions yet"
            message="Add attractions manually or load the Hyderabad demo dataset to get started quickly."
            action={<button onClick={onLoadDemo} className="btn btn-primary"><Icon name="db" size={15} /> Load Demo Data</button>} />
        ) : (
          <div className="grid lg:grid-cols-2 gap-3">
            {attractions.map((a, i) => (
              <AttractionRow key={a.id} a={a} idx={i} onChange={updateAttr} onRemove={removeAttr} errors={errors.attrs} />
            ))}
          </div>
        )}
      </Card>

      {/* ---- Generate ---- */}
      <Card hover={false} className="p-5 sm:p-6 relative overflow-hidden">
        <div className="absolute inset-0 bg-gradient-to-r from-cyan-500/5 via-transparent to-violet-500/5 pointer-events-none" />
        <div className="relative">
          {running ? (
            <div className="space-y-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-cyan-500/15 border border-cyan-400/30 grid place-items-center">
                  <Icon name="cpu" size={19} className="text-cyan-300 animate-pulse" />
                </div>
                <div>
                  <div className="font-display font-bold text-slate-100">Running algorithm engine…</div>
                  <div className="text-[12px] text-slate-400 mono">{RUN_PHASES[Math.min(runStep, RUN_PHASES.length - 1)]}</div>
                </div>
              </div>
              <div className="h-2 rounded-full bg-slate-700/40 overflow-hidden">
                <div className="h-full rounded-full bg-gradient-to-r from-cyan-400 to-violet-500 transition-[width] duration-300"
                  style={{ width: `${progress}%` }} />
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                {RUN_PHASES.map((p, i) => (
                  <div key={p} className={`flex items-center gap-2 text-[11.5px] px-2.5 py-1.5 rounded-lg border transition-all
                    ${i < runStep ? 'border-emerald-400/30 bg-emerald-500/8 text-emerald-300'
                      : i === runStep ? 'border-cyan-400/40 bg-cyan-500/10 text-cyan-200'
                      : 'border-slate-700/40 text-slate-500'}`}>
                    {i < runStep ? <Icon name="check" size={12} /> : <span className="w-3 h-3 rounded-full border border-current grid place-items-center"><span className="w-1 h-1 rounded-full bg-current" /></span>}
                    <span className="truncate">{p}</span>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
              <div>
                <h3 className="font-display font-bold text-lg text-slate-100">Ready to optimise</h3>
                <p className="text-[12.5px] text-slate-400 mt-1">
                  {attractions.length} attraction(s) · Budget {INR(trip.budget)} · Time {HRS(trip.time)} ·
                  Preference: {PREFERENCES.find((p) => p.key === trip.preference)?.label}
                </p>
              </div>
              <button onClick={handleGenerate} className="btn btn-primary !px-6 !py-3 !text-[13.5px] w-full sm:w-auto">

    const t = setTimeout(() => setStep((s) => s + 1), 900);
    return () => clearTimeout(t);
  }, [playing, step, greedy.steps.length]);
  useEffect(() => { setStep(0); setPlaying(false); }, [greedy]);

  const current = greedy.steps[step];
  const visibleDecisions = greedy.decisions.filter((d) => {
    // reveal decisions progressively as steps advance
    const decisionSteps = greedy.steps.findIndex((s) => s.title.includes(`"${d.name}"`));
    return decisionSteps !== -1 && step >= decisionSteps;

  return (

          <Icon name="reset" size={15} /> Reset

        <div className="h-full rounded-full bg-gradient-to-r from-cyan-400 to-violet-500 transition-[width] duration-500"

              <Icon name={current.phase === 'REJECT' ? 'x' : current.phase === 'DONE' ? 'flag' : 'zap'} size={17} />
            </div>
            <div>
              <Chip tone={current.phase === 'REJECT' ? 'rose' : current.phase === 'DONE' ? 'emerald' : 'cyan'}>{current.phase}</Chip>
              <div className="font-display font-bold text-[14.5px] text-slate-100 mt-2">{current.title}</div>
              <p className="text-[12px] text-slate-400 mt-1.5 leading-relaxed">{current.detail}</p>

          </div>
          <div className="mt-4 pt-4 border-t border-slate-700/40 grid grid-cols-2 gap-3">
            <div className="rounded-lg bg-white/[.03] border border-slate-700/40 p-2.5">

                    ${revealed ? (isSel ? 'border-emerald-400/35 bg-emerald-500/8' : 'border-rose-400/25 bg-rose-500/6 opacity-70')

function downsample(grid, maxRows, maxCols) {
  if (!grid.length) return [];
  const rows = grid.length, cols = grid[0].length;
  const rs = Math.max(1, Math.ceil(rows / maxRows));
  const cs = Math.max(1, Math.ceil(cols / maxCols));
  const out = [];
  for (let i = 0; i < rows; i += rs) {
    const row = [];
    for (let j = 0; j < cols; j += cs) row.push(grid[i][j]);
    out.push(row);
  }
  return out;
}

function KnapsackVisualizer({ knapsack }) {
  const [step, setStep] = useState(0);      // 0 = before any item
  const [playing, setPlaying] = useState(false);
  const total = knapsack.snapshots.length;

  useEffect(() => {
    if (!playing) return;
    if (step >= total) { setPlaying(false); return; }
    const t = setTimeout(() => setStep((s) => s + 1), 850);
    return () => clearTimeout(t);
  }, [playing, step, total]);
  useEffect(() => { setStep(0); setPlaying(false); }, [knapsack]);

  const grid = step === 0
    ? Array.from({ length: knapsack.T + 1 }, () => Array(knapsack.B + 1).fill(0))
    : knapsack.snapshots[step - 1].grid;

  const ds = downsample(grid, 40, 44);
  const maxVal = Math.max(1, ...ds.flat());
  const currentItem = step > 0 ? knapsack.snapshots[step - 1].itemName : '—';

  const color = (v) => {
    const t = v / maxVal;
    if (v === 0) return 'rgba(148,163,184,.05)';
    return `rgba(${Math.round(34 + t * 105)}, ${Math.round(211 - t * 60)}, ${Math.round(238 - t * 20)}, ${0.15 + t * 0.8})`;
  };

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center gap-2">
        <button onClick={() => setPlaying(!playing)} className="btn btn-primary !py-2 !px-4 !text-[12.5px]">
          <Icon name={playing ? 'pause' : 'play'} size={15} /> {playing ? 'Pause' : 'Start'}
        </button>
        <button onClick={() => setStep((s) => Math.min(s + 1, total))} className="btn btn-ghost !py-2 !px-3 !text-[12.5px]">
          <Icon name="next" size={15} /> Next Item
        </button>
        <button onClick={() => { setStep(0); setPlaying(false); }} className="btn btn-ghost !py-2 !px-3 !text-[12.5px]">
          <Icon name="reset" size={15} /> Reset
        </button>
        <div className="ml-auto text-[12px] mono text-slate-400">Item {step} / {total}</div>
      </div>

      <div className="grid lg:grid-cols-[1.5fr_1fr] gap-4">
        <Card hover={false} className="p-4">
          <div className="flex items-center justify-between mb-3">
            <div>
              <div className="font-display font-bold text-[14px]">DP Table — dp[time][budget]</div>
              <div className="text-[11px] text-slate-500 mt-0.5">
                Rows: time units ({(knapsack.T * TIME_UNIT).toFixed(1)}h max) · Cols: budget units (₹{knapsack.B * BUDGET_UNIT} max)
              </div>
            </div>
            <Chip tone="violet">Processing: {currentItem}</Chip>
          </div>
          <div className="overflow-auto max-h-[380px] rounded-lg border border-slate-700/40 p-1.5 bg-[#070b16]">
            <div style={{ display: 'grid', gridTemplateColumns: `repeat(${ds[0]?.length || 1}, minmax(0, 1fr))`, gap: '1px', minWidth: (ds[0]?.length || 1) * 12 }}>
              {ds.flat().map((v, i) => (
                <div key={i} title={`value = ${v}`}
                  style={{ background: color(v), height: 12, borderRadius: 2, transition: 'background .35s' }} />
              ))}
            </div>
          </div>
          <div className="flex items-center gap-3 mt-3">
            <span className="text-[11px] text-slate-500">0</span>
            <div className="flex-1 h-2 rounded-full" style={{ background: 'linear-gradient(90deg, rgba(148,163,184,.08), rgba(139,92,246,.35), rgba(34,211,238,.95))' }} />
            <span className="text-[11px] text-slate-500 mono">max {maxVal}</span>
          </div>
        </Card>

        <Card hover={false} className="p-4 space-y-3">
          <div className="font-display font-bold text-[14px]">Optimisation Summary</div>
          <div className="rounded-xl bg-gradient-to-br from-cyan-500/10 to-violet-500/10 border border-cyan-400/25 p-3.5">
            <div className="text-[10.5px] uppercase tracking-wider text-slate-400 font-semibold">Maximum Achievable Value</div>
            <div className="font-display font-black text-3xl grad-text mt-1">{knapsack.totalValue}</div>

          {[
            ['Objective', knapsack.objective],

            ['Total visit time', HRS(knapsack.totalTime)],
            ['Total cost', INR(knapsack.totalCost)],
            ['Unused time', HRS(knapsack.unusedTime)],
            ['Unused budget', INR(knapsack.unusedBudget)],

            <div key={k} className="flex items-center justify-between py-2 border-b border-slate-700/30 last:border-0">

function GraphVisualizer({ graph, startNode, dijkstraResult, bfsOrder, dfsOrder, route }) {
  const [mode, setMode] = useState('dijkstra');
  const [step, setStep] = useState(0);
  const [playing, setPlaying] = useState(false);

  const order = mode === 'dijkstra' ? dijkstraResult.order : mode === 'bfs' ? bfsOrder : dfsOrder;

  useEffect(() => {
    if (!playing) return;
    if (step >= order.length) { setPlaying(false); return; }
    const t = setTimeout(() => setStep((s) => s + 1), 700);
    return () => clearTimeout(t);
  }, [playing, step, order.length]);
  useEffect(() => { setStep(0); setPlaying(false); }, [mode, graph]);

  // Position nodes from lat/lng into a 0..100 viewBox
  const positions = useMemo(() => {
    const all = graph.nodes;
    if (!all.length) return {};
    const lats = all.map((n) => n.lat), lngs = all.map((n) => n.lng);
    const minLat = Math.min(...lats), maxLat = Math.max(...lats);
    const minLng = Math.min(...lngs), maxLng = Math.max(...lngs);
    const spanLat = Math.max(1e-6, maxLat - minLat), spanLng = Math.max(1e-6, maxLng - minLng);
    const pos = {};
    all.forEach((n) => {
      pos[n.id] = {
        x: 12 + ((n.lng - minLng) / spanLng) * 76,
        y: 88 - ((n.lat - minLat) / spanLat) * 76,
      };
    });
    return pos;
  }, [graph]);

  const nodeById = useMemo(() => Object.fromEntries(graph.nodes.map((n) => [n.id, n])), [graph]);
  const visited = new Set(order.slice(0, step));
  const currentId = step > 0 ? order[step - 1] : null;

  const routeIds = route.path.map((p) => p.id);

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center gap-2">
        <div className="flex gap-1 p-1 rounded-xl glass-soft">
          {[['dijkstra', 'Dijkstra'], ['bfs', 'BFS'], ['dfs', 'DFS']].map(([k, l]) => (
            <button key={k} onClick={() => setMode(k)} className={`tab ${mode === k ? 'tab-active' : ''}`}>{l}</button>
          ))}
        </div>
        <button onClick={() => setPlaying(!playing)} className="btn btn-primary !py-2 !px-4 !text-[12.5px]">
          <Icon name={playing ? 'pause' : 'play'} size={15} /> {playing ? 'Pause' : 'Start'}
        </button>
        <button onClick={() => setStep((s) => Math.min(s + 1, order.length))} className="btn btn-ghost !py-2 !px-3 !text-[12.5px]">
          <Icon name="next" size={15} /> Next Node
        </button>
        <button onClick={() => { setStep(0); setPlaying(false); }} className="btn btn-ghost !py-2 !px-3 !text-[12.5px]">
          <Icon name="reset" size={15} /> Reset
        </button>
        <div className="ml-auto text-[12px] mono text-slate-400">Visited {step} / {order.length}</div>
      </div>

      <div className="grid lg:grid-cols-[1.4fr_1fr] gap-4">
        <Card hover={false} className="p-4">
          <div className="font-display font-bold text-[14px] mb-2">Graph — {mode.toUpperCase()} Traversal</div>
          <div className="rounded-xl bg-[#070b16] border border-slate-700/40 overflow-hidden">
            <svg viewBox="0 0 100 100" className="w-full h-[340px]" preserveAspectRatio="xMidYMid meet">
              {/* edges */}
              {graph.edges.map((e, i) => {
                const a = positions[e.a], b = positions[e.b];
                if (!a || !b) return null;
                const bothVisited = visited.has(e.a) && visited.has(e.b);
                const onRoute = routeIds.includes(e.a) && routeIds.includes(e.b) &&
                  Math.abs(routeIds.indexOf(e.a) - routeIds.indexOf(e.b)) === 1;
                return (
                  <line key={i} x1={a.x} y1={a.y} x2={b.x} y2={b.y}
                    stroke={onRoute ? '#22d3ee' : bothVisited ? 'rgba(139,92,246,.55)' : 'rgba(100,116,139,.20)'}
                    strokeWidth={onRoute ? 1.5 : 0.5}
                    strokeDasharray={onRoute ? '3 2' : '0'} className={onRoute ? 'route-flow' : ''} />
                );
              })}
              {/* nodes */}
              {graph.nodes.map((n) => {
                const p = positions[n.id];
                if (!p) return null;
                const isVisited = visited.has(n.id);
                const isCurrent = currentId === n.id;
                const isStart = n.id === 'start';
                return (
                  <g key={n.id}>
                    {isCurrent && <circle cx={p.x} cy={p.y} r="6" fill="#22d3ee" opacity=".22">
                      <animate attributeName="r" values="5;8;5" dur="1.4s" repeatCount="indefinite" />
                    </circle>}
                    <circle cx={p.x} cy={p.y} r={isStart ? 3.4 : 2.6}
                      fill={isStart ? '#34d399' : isCurrent ? '#22d3ee' : isVisited ? '#8b5cf6' : '#1e293b'}
                      stroke={isVisited || isStart ? '#e2e8f0' : '#475569'} strokeWidth="0.5" />
                    <text x={p.x} y={p.y - 4.5} textAnchor="middle" fontSize="2.6"
                      fill={isVisited ? '#cbd5e1' : '#64748b'} fontFamily="Inter">
                      {n.name.length > 16 ? n.name.slice(0, 15) + '…' : n.name}
                    </text>
                  </g>
                );
              })}
            </svg>
          </div>
        </Card>

        <Card hover={false} className="p-4">
          <div className="font-display font-bold text-[14px] mb-3">Traversal Order</div>
          <div className="flex flex-wrap gap-1.5 max-h-[180px] overflow-y-auto">
            {order.map((id, i) => (
              <span key={id + i}
                className={`chip ${i < step ? 'bg-cyan-500/15 text-cyan-200 border border-cyan-400/30'
                  : 'bg-slate-700/25 text-slate-500 border border-slate-600/30'}`}>
                {i + 1}. {nodeById[id]?.name || id}
              </span>
            ))}
          </div>

          <div className="mt-4 pt-4 border-t border-slate-700/40">
            <div className="text-[10.5px] uppercase tracking-wider text-slate-500 font-semibold mb-2">
              Shortest travel time from start (Dijkstra)
            </div>
            <div className="space-y-1.5 max-h-[170px] overflow-y-auto">
              {graph.nodes.filter((n) => n.id !== 'start').map((n) => (
                <div key={n.id} className="flex items-center justify-between text-[12px]">
                  <span className="text-slate-300 truncate pr-2">{n.name}</span>
                  <span className="mono text-cyan-300 shrink-0">
                    {isFinite(dijkstraResult.dist[n.id]) ? HRS(dijkstraResult.dist[n.id]) : '∞'}
                  </span>
                </div>
              ))}
            </div>
          </div>
        </Card>
      </div>
    </div>
  );
}

function AlgorithmsPage({ attractions, trip, result, notify, go }) {
  const [tab, setTab] = useState('greedy');

  // compute live from current state
  const computed = useMemo(() => {
    if (!attractions.length) return null;
    const opts = { budget: trip.budget, time: trip.time, preference: trip.preference };
    const greedy = runGreedy(attractions, opts);
    const knapsack = runKnapsack(attractions, opts);
    const startNode = { id: 'start', name: trip.startLocation || 'Start', lat: trip.startLat, lng: trip.startLng, duration: 0, cost: 0, value: 0, priority: 0 };
    const graphNodes = [startNode, ...attractions];
    const graph = buildGraph(graphNodes);
    const dij = dijkstra(graph, 'start');
    const b = bfs(graph, 'start');
    const d = dfs(graph, 'start');
    const route = buildRoute(startNode, knapsack.selected, trip.startClock);
    return { greedy, knapsack, graph, dij, b, d, route, startNode };
  }, [attractions, trip]);

  if (!computed) {
    return <EmptyState icon="cpu" title="No data to visualise"
      message="Add attractions on the Plan Trip page (or load the demo dataset) to run the algorithm visualiser."
      action={<button onClick={() => go('plan')} className="btn btn-primary"><Icon name="route" size={15} /> Go to Plan Trip</button>} />;
  }

  return (
    <div className="space-y-5 fade-in">
      <Card hover={false} className="p-4 sm:p-5">
        <div className="flex flex-wrap items-center gap-3">
          <div className="flex gap-1 p-1 rounded-xl glass-soft">
            {[['greedy', 'Greedy', 'zap'], ['knapsack', 'Knapsack', 'layers'], ['graph', 'Graph', 'branch']].map(([k, l, ic]) => (
              <button key={k} onClick={() => setTab(k)} className={`tab flex items-center gap-1.5 ${tab === k ? 'tab-active' : ''}`}>
                <Icon name={ic} size={14} /> {l}
              </button>
            ))}
          </div>
          <div className="text-[11.5px] text-slate-500 ml-auto">
            Live computation from current inputs · {attractions.length} attractions · {INR(trip.budget)} · {HRS(trip.time)}
          </div>
        </div>
      </Card>

      {tab === 'greedy' && <GreedyVisualizer greedy={computed.greedy} />}
      {tab === 'knapsack' && <KnapsackVisualizer knapsack={computed.knapsack} />}
      {tab === 'graph' && (
        <GraphVisualizer graph={computed.graph} startNode={computed.startNode}
          dijkstraResult={computed.dij} bfsOrder={computed.b} dfsOrder={computed.d} route={computed.route} />
      )}
    </div>
  );
}

/* ---------------------------------------------------------------------------

   ------------------------------------------------------------------------- */
function MapView({ attractions, trip, route, selectedIds, startNode }) {
  const containerRef = useRef(null);
  const mapRef = useRef(null);
  const routeLayerRef = useRef(null);
  const animRef = useRef(null);
  const coordsRef = useRef([]);

  useEffect(() => {
    if (!containerRef.current) return;
    const map = L.map(containerRef.current, { zoomControl: false, attributionControl: true });
    mapRef.current = map;

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19, subdomains: 'abcd',
      attribution: '&copy; OpenStreetMap &copy; CARTO',
    }).addTo(map);

    // start marker
    L.marker([startNode.lat, startNode.lng], {
      icon: L.divIcon({ className: '', html: `<div class="mk mk-start"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5V21H3z"/></svg></div>`, iconSize: [28, 28], iconAnchor: [14, 14] }),
    }).addTo(map).bindPopup(`<div style="font-weight:700;color:#a7f3d0;margin-bottom:2px">${startNode.name}</div><div style="color:#94a3b8">Trip starting point</div>`);

    // attraction markers
    attractions.forEach((a) => {
      const seq = route.path.findIndex((p) => p.id === a.id);
      const isSel = seq > 0;
      const html = `<div class="mk ${isSel ? 'mk-sel' : 'mk-off'}">${isSel ? seq : ''}</div>`;
      const icon = L.divIcon({ className: '', html, iconSize: [28, 28], iconAnchor: [14, 14] });
      L.marker([a.lat, a.lng], { icon }).addTo(map).bindPopup(`
        <div style="min-width:170px">
          <div style="font-weight:700;font-size:13px;color:#e2e8f0;margin-bottom:4px">${a.name}</div>
          <div style="color:#94a3b8;font-size:11px;margin-bottom:6px">${a.location}</div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:#cbd5e1"><span>Cost</span><b style="color:#67e8f9">${INR(a.cost)}</b></div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:#cbd5e1"><span>Duration</span><b style="color:#c4b5fd">${HRS(a.duration)}</b></div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:#cbd5e1"><span>Priority</span><b style="color:#fcd34d">${a.priority}</b></div>
          <div style="display:flex;justify-content:space-between;font-size:11px;color:#cbd5e1"><span>Value</span><b style="color:#6ee7b7">${a.value}</b></div>
          <div style="margin-top:6px;font-size:10.5px;font-weight:700;color:${isSel ? '#34d399' : '#94a3b8'}">
            ${isSel ? '✓ SELECTED — stop #' + seq : '✕ NOT SELECTED'}
          </div>
        </div>`);
    });

    // fit bounds
    const pts = attractions.map((a) => [a.lat, a.lng]);
    pts.push([startNode.lat, startNode.lng]);
    if (pts.length > 1) map.fitBounds(L.latLngBounds(pts).pad(0.18));
    else map.setView(pts[0] || [17.385, 78.4867], 12);

    // progressive route polyline
    coordsRef.current = route.path.map((p) => [p.lat, p.lng]);
    if (coordsRef.current.length > 1) {
      const line = L.polyline([], { color: '#22d3ee', weight: 3.2, opacity: 0.92, lineCap: 'round' }).addTo(map);
      routeLayerRef.current = line;
      let i = 0;
      animRef.current = setInterval(() => {
        if (i >= coordsRef.current.length) { clearInterval(animRef.current); return; }
        line.addLatLng(coordsRef.current[i]); i++;
      }, 340);
    }

    return () => {
      if (animRef.current) clearInterval(animRef.current);
      map.remove();
      mapRef.current = null;
      routeLayerRef.current = null;
    };
  }, [attractions, trip.startLat, trip.startLng, trip.startLocation, route, startNode]);

  const fitRoute = () => {
    const map = mapRef.current; if (!map) return;
    const pts = route.path.map((p) => [p.lat, p.lng]);
    if (pts.length > 1) map.fitBounds(L.latLngBounds(pts).pad(0.25));
  };
  const fitAll = () => {
    const map = mapRef.current; if (!map) return;
    const pts = attractions.map((a) => [a.lat, a.lng]);
    pts.push([startNode.lat, startNode.lng]);
    if (pts.length > 1) map.fitBounds(L.latLngBounds(pts).pad(0.18));
  };
  const zoomIn = () => mapRef.current?.zoomIn();
  const zoomOut = () => mapRef.current?.zoomOut();
  const resetRoute = () => {
    const map = mapRef.current; if (!map) return;
    if (routeLayerRef.current) { map.removeLayer(routeLayerRef.current); routeLayerRef.current = null; }
    if (animRef.current) clearInterval(animRef.current);
    if (coordsRef.current.length > 1) {
      const line = L.polyline([], { color: '#22d3ee', weight: 3.2, opacity: 0.92, lineCap: 'round' }).addTo(map);
      routeLayerRef.current = line;
      let i = 0;
      animRef.current = setInterval(() => {
        if (i >= coordsRef.current.length) { clearInterval(animRef.current); return; }
        line.addLatLng(coordsRef.current[i]); i++;
      }, 340);
    }
  };

  return (
    <div className="space-y-5 fade-in">
      <Card hover={false} className="p-3 sm:p-4">
        <div className="flex flex-wrap items-center justify-between gap-3 mb-3">
          <div>
            <h2 className="font-display font-bold text-[15px]">Interactive Route Map</h2>
            <p className="text-[11.5px] text-slate-500 mt-0.5">
              Glowing numbered markers = selected stops · dim markers = unselected attractions
            </p>
          </div>
          <div className="flex flex-wrap gap-2">
            <button onClick={zoomIn} className="btn btn-ghost !px-3 !py-2 !text-[12px]"><Icon name="plus" size={14} /> Zoom</button>
            <button onClick={zoomOut} className="btn btn-ghost !px-3 !py-2 !text-[12px]"><Icon name="x" size={14} /> Out</button>
            <button onClick={fitAll} className="btn btn-ghost !px-3 !py-2 !text-[12px]"><Icon name="pin" size={14} /> All Attractions</button>
            <button onClick={fitRoute} className="btn btn-ghost !px-3 !py-2 !text-[12px]"><Icon name="fit" size={14} /> Fit Route</button>
            <button onClick={resetRoute} className="btn btn-primary !px-3 !py-2 !text-[12px]"><Icon name="reset" size={14} /> Replay Route</button>
          </div>
        </div>
        <div ref={containerRef} className="w-full h-[420px] sm:h-[540px] rounded-2xl overflow-hidden border border-slate-700/40" />
      </Card>

      <div className="grid sm:grid-cols-3 gap-4">
        <StatCard icon="route" label="Total Travel Distance" value={route.totalDist} decimals={1} suffix=" km" accent="cyan" />
        <StatCard icon="clock" label="Total Travel Time" value={route.totalTravel} decimals={2} suffix=" h" accent="violet" />
        <StatCard icon="pin" label="Stops on Route" value={route.legs.length} accent="emerald" />
      </div>
    </div>
  );
}

      message="No attractions were selected by the active algorithm, so no visit order could be built." />;

    <div className="relative pl-2">
      <div className="absolute left-[26px] top-3 bottom-3 w-[2px] timeline-line rounded-full" />
      <div className="space-y-3">
        {route.legs.map((leg, i) => (
          <div key={leg.node.id} className="relative flex gap-4 fade-in" style={{ animationDelay: `${i * 90}ms` }}>
            <div className="relative z-10 shrink-0">
              <div className="w-[52px] h-[52px] rounded-2xl bg-gradient-to-br from-cyan-500/25 to-violet-500/25 border border-cyan-400/35 grid place-items-center shadow-[0_0_22px_-6px_rgba(34,211,238,.9)]">

              </div>

                  <div className="font-display font-bold text-[14.5px] text-slate-100 truncate">{leg.node.name}</div>

                  <div className="mono text-[15px] font-bold text-cyan-300">{fromMinutes(leg.arrival)}</div>
                  <div className="text-[10.5px] text-slate-500">arrival</div>

              </div>
